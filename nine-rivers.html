<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Nine Rivers</title>
<style>
:root{
  --felt-hi:#1a8163; --felt-lo:#063a2c; --felt-deep:#03231b;
  --panel:rgba(3,35,27,.72);
  --gold:#f2c14e; --gold-lo:#c2902c;
  --cream:#fdf8ec; --cream-2:#f2e9d4; --edge:#e0d0ac; --deep:#b79f74;
  --ink:#232b26; --red:#c0392b; --green:#1f7a52; --blue:#28527a;
  --tw:56px; --th:74px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html{height:100%;background:var(--felt-deep)}
body{margin:0;overflow:hidden}
body{
  /* height:100% dies inside an auto-sized iframe, so pin a floor in px as well */
  height:100dvh;min-height:560px;
  background:
    radial-gradient(85% 55% at 50% 26%, var(--felt-hi) 0%, var(--felt-lo) 62%, var(--felt-deep) 100%),
    var(--felt-deep);
  background-attachment:fixed;
  color:#eef3ef;font-family:"Avenir Next","Segoe UI",Inter,system-ui,sans-serif;
  display:flex;flex-direction:column;height:100%;
}
body::after{ /* soft felt grain */
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;z-index:0;
  background-image:radial-gradient(rgba(255,255,255,.5) .5px, transparent .5px);
  background-size:4px 4px;
}

/* ---------------- top bar ---------------- */
#top{flex:none;padding:8px 10px 0;display:flex;align-items:center;gap:8px;z-index:20}
.icon{
  width:40px;height:40px;flex:none;border-radius:12px;border:1px solid rgba(242,193,78,.35);
  background:var(--panel);display:flex;align-items:center;justify-content:center;padding:0;
}
.icon svg{width:20px;height:20px;fill:none;stroke:var(--gold);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.readout{
  flex:1;display:flex;align-items:center;justify-content:space-around;gap:6px;
  height:40px;border-radius:12px;background:var(--panel);border:1px solid rgba(242,193,78,.22);
  padding:0 8px;
}
.stat{display:flex;flex-direction:column;align-items:center;line-height:1.05;min-width:52px}
.stat .k{font-size:9.5px;letter-spacing:.06em;color:#8fb6a5}
.stat .v{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;color:#fff}
.stat.warn .v{color:#ffb4a8}
#timewrap{flex:none;padding:0 10px;margin-top:8px}
.timerow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.timerow span{font-size:9.5px;letter-spacing:.06em;color:#8fb6a5}
.timerow b{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:#fff}
#timewrap.low .timerow b{color:#ff9d8e}
#bar{height:8px;border-radius:99px;background:rgba(0,0,0,.4);overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
#bar i{display:block;height:100%;width:100%;border-radius:99px;
  background:linear-gradient(90deg,#37b98a,var(--gold));transition:width .2s linear}
#bar.low i{background:linear-gradient(90deg,#a83226,#e05a3c)}

/* ---------------- board ---------------- */
#stage{flex:1;position:relative;overflow:hidden;margin-top:6px}
#fit{position:absolute;top:0;left:0;transform-origin:top left}
#board{position:relative}
.tile{
  position:absolute;width:var(--tw);height:var(--th);border-radius:9px;
  background:linear-gradient(168deg,#fffdf6 0%,var(--cream) 38%,var(--cream-2) 100%);
  border:1px solid #cdb98f;
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,.95),
    inset -3px -3px 0 rgba(0,0,0,.05),
    0 4px 0 0 var(--deep),
    0 6px 8px rgba(0,0,0,.4);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  touch-action:none;transition:box-shadow .12s,transform .12s,opacity .18s;
}
.tile[data-z="1"]{box-shadow:inset 0 2px 0 rgba(255,255,255,.95),0 4px 0 0 var(--deep),0 9px 13px rgba(0,0,0,.48)}
.tile[data-z="2"]{box-shadow:inset 0 2px 0 rgba(255,255,255,.95),0 4px 0 0 var(--deep),0 12px 17px rgba(0,0,0,.52)}
.tile[data-z="3"]{box-shadow:inset 0 2px 0 rgba(255,255,255,.95),0 4px 0 0 var(--deep),0 15px 21px rgba(0,0,0,.56)}
.tile[data-z="4"]{box-shadow:inset 0 2px 0 rgba(255,255,255,.95),0 4px 0 0 var(--deep),0 18px 26px rgba(0,0,0,.6)}
.tile.blocked{filter:brightness(.97)}
.tile.blocked::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(6,34,27,.30) 0%,rgba(6,34,27,.10) 38%,rgba(6,34,27,.02) 100%)}
.tile.sel{
  transform:translateY(-3px);
  box-shadow:inset 0 0 0 3px var(--gold), 0 5px 0 0 var(--deep), 0 10px 16px rgba(0,0,0,.5);
}
.tile.hint{animation:hintPulse .8s ease-in-out 3}
@keyframes hintPulse{
  0%,100%{box-shadow:inset 0 2px 0 rgba(255,255,255,.95),0 4px 0 0 var(--deep),0 7px 10px rgba(0,0,0,.45)}
  50%{box-shadow:inset 0 0 0 3px #4ce0a6,0 4px 0 0 var(--deep),0 0 18px 4px rgba(76,224,166,.75)}
}
.tile.drag{transition:none;box-shadow:0 14px 24px rgba(0,0,0,.55),inset 0 0 0 3px var(--gold);z-index:9999!important}
.tile.gone{opacity:0;transform:scale(.6) rotate(-8deg);pointer-events:none}
.tile.wrong{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#board.fog .tile.blocked .face{opacity:0}
#board.fog .tile.blocked{background:repeating-linear-gradient(45deg,#d8c8a6 0 7px,#cdbc98 7px 14px)}
.face{width:100%;height:100%;display:flex;align-items:center;justify-content:center;transition:opacity .2s}
.face svg{width:100%;height:100%}
.glyph{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Songti SC",serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;color:var(--ink);font-weight:600}
.glyph .top{font-size:calc(var(--tw)*.50)}
.glyph .bot{font-size:calc(var(--tw)*.40);margin-top:2px;color:var(--red)}
.glyph.solo{font-size:calc(var(--tw)*.68)}
.glyph.red{color:var(--red)} .glyph.green{color:var(--green)} .glyph.blue{color:var(--blue)}
.glyph.small{font-size:calc(var(--tw)*.52)}

.pop{position:absolute;z-index:9500;font-weight:800;font-size:19px;color:#ffe6a6;
  pointer-events:none;text-shadow:0 1px 0 #6b4a10,0 3px 8px rgba(0,0,0,.85);animation:rise .85s ease-out forwards}
.pop.bad{color:#ff9d8e}
@keyframes rise{to{transform:translateY(-40px);opacity:0}}
#combo{
  position:absolute;left:50%;top:14%;transform:translateX(-50%) scale(.6);
  font-family:"Iowan Old Style",Georgia,serif;font-size:34px;font-weight:800;color:var(--gold);
  text-shadow:0 3px 0 #7a4d0d,0 8px 22px rgba(0,0,0,.65);opacity:0;pointer-events:none;z-index:9600;
  white-space:nowrap;
}
#boardlabel{position:absolute;top:6px;left:0;right:0;text-align:center;font-size:12.5px;
  letter-spacing:.03em;color:rgba(190,222,208,.55);pointer-events:none;z-index:5}
#zoomhint{transition:opacity .4s;position:absolute;left:50%;transform:translateX(-50%);bottom:6px;z-index:30;
  font-size:11.5px;color:#9dc4b3;background:rgba(3,35,27,.8);border:1px solid rgba(242,193,78,.25);
  padding:5px 11px;border-radius:99px;pointer-events:none;white-space:nowrap}
#combo.show{animation:comboIn 1.1s ease-out}
@keyframes comboIn{
  0%{opacity:0;transform:translateX(-50%) scale(.5)}
  25%{opacity:1;transform:translateX(-50%) scale(1.12)}
  70%{opacity:1;transform:translateX(-50%) scale(1)}
  100%{opacity:0;transform:translateX(-50%) scale(1) translateY(-24px)}
}

/* ---------------- props bar ---------------- */
#props{flex:none;display:flex;justify-content:center;gap:26px;
  padding:10px 12px calc(12px + env(safe-area-inset-bottom));z-index:20}
.prop{
  position:relative;width:64px;height:64px;border-radius:50%;padding:0;
  background:radial-gradient(120% 120% at 30% 25%, #2fb98d 0%, #12674e 100%);
  border:2px solid rgba(242,193,78,.55);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  box-shadow:0 5px 0 rgba(0,0,0,.35),0 8px 14px rgba(0,0,0,.4);
  color:#fff;font-family:inherit;cursor:pointer;
}
.prop svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.prop span{font-size:10px;letter-spacing:.04em;color:#d8f0e5}
.prop b{position:absolute;top:-4px;right:-4px;min-width:24px;height:24px;border-radius:99px;
  background:var(--gold);color:#3a2a06;font-size:12.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center;border:2px solid #06392c}
.prop:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.prop:disabled{opacity:.4}
.prop:disabled b{background:#7d8b84;color:#2a3330}
button:focus-visible,.prop:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* ---------------- modal ---------------- */
#modal{position:fixed;inset:0;min-height:100%;background:rgba(2,20,15,.86);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;padding:20px;z-index:100;overflow:auto}
#modal.show{display:flex}
.card{
  width:100%;max-width:350px;text-align:center;border-radius:22px;padding:26px 22px 22px;
  background:linear-gradient(170deg,#14795c 0%,#0a4534 55%,#073527 100%);
  border:2px solid rgba(242,193,78,.5);
  box-shadow:0 20px 50px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.15);
}
.emblem{display:flex;justify-content:center;gap:6px;margin:0 0 14px}
.emblem span{width:38px;height:50px;border-radius:7px;transform:rotate(var(--r));
  background:linear-gradient(168deg,#fffdf6,#f2e9d4);border:1px solid #cdb98f;
  box-shadow:0 3px 0 var(--deep),0 6px 10px rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center}
.emblem b{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",serif;font-size:22px}
.card h2{margin:0 0 6px;font-size:26px;color:var(--gold);letter-spacing:.01em;
  font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.card .sub{margin:0 0 18px;font-size:14.5px;color:#bfded0;line-height:1.5}
.big{font-size:46px;font-weight:800;color:#fff;margin:2px 0 4px;
  font-family:"Iowan Old Style",Georgia,serif;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{
  padding:15px 14px;border-radius:14px;border:2px solid rgba(0,0,0,.25);
  background:linear-gradient(180deg,#2fae83,#1b7a5b);color:#fff;
  font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;
  box-shadow:0 4px 0 rgba(0,0,0,.35);
}
.btn.ghost{background:rgba(255,255,255,.08);border-color:rgba(242,193,78,.4);color:#e9f4ee;box-shadow:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.boon{text-align:left;display:flex;align-items:center;gap:12px;padding:13px 14px}
.boon .em{flex:none;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.22);border:1px solid rgba(242,193,78,.45)}
.boon .em svg{width:19px;height:19px;fill:none;stroke:var(--gold);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.boon .bt{display:block;font-size:15px}
.boon .bd{display:block;font-size:12.5px;color:#cfe7db;font-weight:500;margin-top:2px}
.tally{display:flex;justify-content:space-between;font-size:14px;color:#bfded0;padding:9px 2px;
  border-bottom:1px solid rgba(255,255,255,.1)}
.tally b{color:#fff}
.tally:last-of-type{margin-bottom:16px}
.chips{display:flex;gap:8px;margin-bottom:16px}
.chips .btn{flex:1;padding:11px 4px;font-size:13px;background:rgba(255,255,255,.08);
  border-color:rgba(242,193,78,.35);box-shadow:none}
.chips .btn[aria-pressed="true"]{background:linear-gradient(180deg,#2fae83,#1b7a5b);border-color:var(--gold)}
#toast{position:fixed;left:50%;bottom:164px;transform:translateX(-50%);
  background:rgba(3,35,27,.95);border:1px solid rgba(242,193,78,.5);padding:11px 16px;
  border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;
  max-width:86vw;text-align:center;z-index:60}
#toast.show{opacity:1}
@keyframes fadeOnly{from{opacity:1}to{opacity:0}}
@media (prefers-reduced-motion:reduce){
  /* keep the feedback that tells you what happened; drop the motion */
  .tile{transition:opacity .15s,box-shadow .1s}
  .tile.sel{transform:none}
  .tile.wrong,.tile.gone{animation:none;transform:none}
  .tile.hint{animation:hintPulse 1s steps(2,end) 3}
  .pop{animation:fadeOnly .85s ease-out forwards;transform:none}
  #combo.show{animation:fadeOnly 1.1s ease-out forwards;transform:translateX(-50%);opacity:1}
  .btn:active,.prop:active{transform:none}
}
/* ---- Nine Rivers additions ---- */
.tile.triple::before{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;
  background:linear-gradient(180deg,#f6cf72,#c2902c);border-top:1px solid rgba(0,0,0,.15)}
.tile.wild{background:linear-gradient(168deg,#fffdf6 0%,#f7f0dc 40%,#efe2c2 100%)}
.tile.wild::after{content:"";position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ffe9ae,#d9a53c);box-shadow:0 0 5px rgba(242,193,78,.9)}
.tile.open{box-shadow:inset 0 0 0 3px rgba(242,193,78,.9),0 4px 0 0 var(--deep),0 8px 14px rgba(0,0,0,.5)}
.tile.open::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 50% 50%,rgba(242,193,78,.22),transparent 70%)}
#flow{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;border:1px solid rgba(0,0,0,.2);z-index:30;
  font-size:13px;font-weight:700;letter-spacing:.02em;color:#08302a;
  background:linear-gradient(180deg,#f6cf72,#dCA43C);border-radius:99px;padding:6px 14px;
  box-shadow:0 3px 10px rgba(0,0,0,.45);opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#flow.show{opacity:1}
#flow.set{background:linear-gradient(180deg,#8fd8bd,#3f9d7c);color:#04241c}
#flow.dot{background:linear-gradient(180deg,#8ab6e0,#2f5f8e);color:#f2f7fc}
#flow.bam{background:linear-gradient(180deg,#8ddcb2,#1f7a52);color:#f0fbf5}
#flow.char{background:linear-gradient(180deg,#e8b48c,#a35a32);color:#fff6ef}
#goal{position:absolute;top:5px;left:0;right:0;text-align:center;font-size:12.5px;z-index:5;
  color:rgba(190,222,208,.62);pointer-events:none;padding:0 12px}
#goal .met{color:#7fe0b4} #goal .lost{color:#ef9a90;text-decoration:line-through}
.stars{font-size:30px;letter-spacing:6px;color:#3d5f52;margin:2px 0 2px}
.stars .on{color:var(--gold);text-shadow:0 2px 8px rgba(242,193,78,.5)}
.rules{text-align:left;font-size:13.5px;line-height:1.55;color:#cfe7db;margin-bottom:16px}
.rules p{margin:0 0 10px} .rules b{color:#fff} .rules .gold{color:var(--gold)}

/* ---- juice ---- */
.tile.dealing{animation:dealTile .38s cubic-bezier(.2,.9,.3,1.25) backwards;animation-delay:var(--d,0s)}
@keyframes dealTile{from{transform:translateY(-44px) scale(.86);opacity:0}to{transform:none;opacity:1}}
body.reduced .tile.dealing{animation:none}
#stage.shake{animation:shk .3s ease-out}
@keyframes shk{
  0%,100%{transform:translate(0,0)}
  20%{transform:translate(calc(var(--sh,3px)*-1),1px)}
  50%{transform:translate(var(--sh,3px),-1px)}
  80%{transform:translate(calc(var(--sh,3px)*-.55),0)}
}
.tile.sel{transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .14s}
.burst{position:absolute;width:var(--tw);height:var(--th);border-radius:10px;pointer-events:none;z-index:9400;
  background:radial-gradient(circle at 50% 50%,rgba(255,240,205,.95),rgba(242,193,78,.35) 45%,transparent 72%);
  animation:burstOut .5s ease-out forwards}
@keyframes burstOut{from{transform:scale(.55);opacity:.95}to{transform:scale(2.1);opacity:0}}
.chip{position:fixed;z-index:9999;transform:translate(0,0);pointer-events:none;
  font-size:19px;font-weight:800;color:#ffe6a6;text-shadow:0 1px 0 #6b4a10,0 3px 8px rgba(0,0,0,.85);
  transition:transform .52s cubic-bezier(.35,0,.2,1),opacity .52s ease-in}
.tile.nudge{animation:nudgeA 1.7s ease-in-out}
@keyframes nudgeA{
  0%,100%{box-shadow:inset 0 2px 0 rgba(255,255,255,.95),0 4px 0 0 var(--deep),0 6px 8px rgba(0,0,0,.4)}
  30%,70%{box-shadow:inset 0 0 0 2px rgba(242,193,78,.7),0 4px 0 0 var(--deep),0 0 14px 2px rgba(242,193,78,.35)}
}
.stars span{display:inline-block;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.stars .on{color:var(--gold);text-shadow:0 2px 10px rgba(242,193,78,.6);transform:scale(1.18)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left}
.toggle .bd{display:block;font-size:12px;color:#a8c2b6;font-weight:500;margin-top:2px}
.toggle .sw{flex:none;width:46px;height:27px;border-radius:99px;background:rgba(0,0,0,.35);
  border:1px solid rgba(242,193,78,.35);position:relative;transition:background .18s}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;
  background:#9fb5aa;transition:transform .18s,background .18s}
.toggle[aria-pressed="true"] .sw{background:linear-gradient(180deg,#2fae83,#1b7a5b)}
.toggle[aria-pressed="true"] .sw::after{transform:translateX(19px);background:#fff}
/* user-chosen reduced motion mirrors the OS setting */
body.reduced .tile{transition:opacity .15s,box-shadow .1s}
body.reduced .tile.sel{transform:none}
body.reduced .tile.wrong,body.reduced .tile.gone,body.reduced .tile.nudge{animation:none;transform:none}
body.reduced #stage.shake{animation:none}
body.reduced .burst{display:none}
body.reduced #combo.show{animation:fadeOnly 1.1s ease-out forwards;transform:translateX(-50%);opacity:1}
</style>
</head>
<body>

<div id="top">
  <button class="icon" id="btn-back" aria-label="Menu">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <div class="readout">
    <div class="stat"><div class="k">LEVEL</div><div class="v" id="s-level">1</div></div>
    <div class="stat"><div class="k">SCORE</div><div class="v" id="s-score">0</div></div>
    <div class="stat"><div class="k">TILES</div><div class="v" id="s-tiles">36</div></div>
    <div class="stat" id="s-match-wrap"><div class="k">SETS</div><div class="v" id="s-match">0</div></div>
  </div>
</div>
<div id="timewrap" hidden><div class="timerow"><span>TIME</span><b id="clockText">1:40</b></div><div id="bar"><i></i></div></div>

<div id="stage">
  <div id="fit"><div id="board"></div></div>
  <div id="goal"></div>
  <div id="combo"></div>
  <div id="flow"></div>
  <div id="zoomhint" hidden>Pinch to zoom &middot; drag the felt to move &middot; double-tap to fit</div>
</div>

<div id="props">
  <button class="prop" id="p-undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg><span>Undo</span><b>3</b></button>
  <button class="prop" id="p-hint"><svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.8 1 1.5 1 2.5h6c0-1 .3-1.7 1-2.5A6 6 0 0 0 12 3Z"/></svg><span>Hint</span><b>3</b></button>
  <button class="prop" id="p-shuf"><svg viewBox="0 0 24 24"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg><span>Shuffle</span><b>3</b></button>
</div>

<div id="toast"></div>
<div id="modal"><div class="card" id="card"></div></div>

<script>
(() => {
"use strict";
const $=id=>document.getElementById(id);

/* ================= storage ================= */
const mem={};
async function save(k,v){
  mem[k]=v;
  try{ localStorage.setItem("nine_rivers_"+k, JSON.stringify(v)); }catch(e){}
  try{ if(window.storage) await window.storage.set(k,JSON.stringify(v)); }catch(e){}
}
async function load(k){
  try{
    const l=localStorage.getItem("nine_rivers_"+k);
    if(l) return JSON.parse(l);
  }catch(e){}
  try{
    if(window.storage){
      const r=await window.storage.get(k);
      if(r&&r.value) return JSON.parse(r.value);
    }
  }catch(e){}
  return mem[k]??null;
}

const shuffled=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};

/* ================= Nine Rivers rules ================= */
const isWildSuit=s=>s==="flower"||s==="season";
const keyOf=t=>isWildSuit(t.suit)?t.suit:t.suit+t.rank;
const isWild=t=>isWildSuit(t.suit)||t.open;       // wild by nature, or stranded and turned wild
const compat=(a,b)=>isWild(a)||isWild(b)||keyOf(a)===keyOf(b);

function typePool(){
  const t=[];
  ["dot","bam","char"].forEach(s=>{for(let r=1;r<=9;r++)t.push({suit:s,rank:r});});
  for(let r=1;r<=4;r++)t.push({suit:"wind",rank:r});
  for(let r=1;r<=3;r++)t.push({suit:"dragon",rank:r});
  return t;
}
/* a board is a list of "sets": 3 of a kind (banded), 2 of a kind, or a wild pair */
function planSets(total){
  const triples = total<=40?2 : total<=72?4 : 6;      // must stay even to keep the count even
  const wildPairs = total<=40?1 : total<=88?2 : 3;
  const pool=shuffled(typePool());let i=0;
  const sets=[];
  for(let k=0;k<triples;k++)sets.push({n:3,type:pool[i++%pool.length]});
  for(let k=0;k<wildPairs;k++)sets.push({n:2,type:{suit:k%2?"flower":"season"}});
  const rest=(total-3*triples-2*wildPairs)/2;
  for(let k=0;k<rest;k++)sets.push({n:2,type:pool[i++%pool.length]});
  return shuffled(sets);
}
/* geometry */
const covered=(t,L)=>L.some(u=>u!==t&&u.z>t.z&&Math.abs(u.x-t.x)<2&&Math.abs(u.y-t.y)<2);
const sideB=(t,L,d)=>L.some(u=>u!==t&&u.z===t.z&&u.x===t.x+2*d&&Math.abs(u.y-t.y)<2);
const isFree=(t,L)=>!covered(t,L)&&!(sideB(t,L,-1)&&sideB(t,L,1));

/* peel sets off a full board in reverse -> the deal always has a wild-free solution */
function peel(positions,sizes){
  for(let a=0;a<500;a++){
    const liveP=positions.map(p=>({x:p.x,y:p.y,z:p.z})),order=[];
    let ok=true,si=0;
    while(liveP.length){
      const n=sizes[si++];
      if(n===undefined){ok=false;break;}
      const free=liveP.filter(t=>isFree(t,liveP));
      if(free.length<n){ok=false;break;}
      free.sort((m,q)=>q.z-m.z);
      const pool=free.slice(0,Math.max(n,Math.ceil(free.length*.7)));
      const picked=[];
      while(picked.length<n){
        const c=pool[Math.random()*pool.length|0];
        if(!picked.includes(c))picked.push(c);
      }
      order.push(picked);
      picked.forEach(t=>liveP.splice(liveP.indexOf(t),1));
    }
    if(ok&&si===sizes.length)return order;
  }
  return null;
}
function dealBoard(positions){
  const sets=planSets(positions.length);
  const order=peel(positions,sets.map(s=>s.n));
  if(!order)return null;
  const tiles=[];
  order.forEach((posGroup,gi)=>{
    const ty=sets[gi].type;
    posGroup.forEach(pos=>tiles.push({
      x:pos.x,y:pos.y,z:pos.z,
      suit:ty.suit, rank:isWildSuit(ty.suit)?(1+(Math.random()*4|0)):ty.rank,
      set:gi, size:sets[gi].n, open:false, removed:false
    }));
  });
  return tiles;
}

/* every legal set currently on the table */
function findSets(){
  const L=live(),f=L.filter(t=>isFree(t,L));
  const wilds=f.filter(isWild),norm=f.filter(t=>!isWild(t));
  const byKey=new Map();
  norm.forEach(t=>{const k=keyOf(t);(byKey.get(k)||byKey.set(k,[]).get(k)).push(t);});
  const out=[];
  byKey.forEach(list=>{
    const s2=list.filter(t=>t.size===2),s3=list.filter(t=>t.size===3);
    for(let i=0;i+1<s2.length;i+=2)out.push([s2[i],s2[i+1]]);
    for(let i=0;i+2<s3.length;i+=3)out.push([s3[i],s3[i+1],s3[i+2]]);
    if(s3.length>=2&&wilds.length>=1)out.push([s3[0],s3[1],wilds[0]]);
    if(s3.length===1&&wilds.length>=2)out.push([s3[0],wilds[0],wilds[1]]);
  });
  if(wilds.length>=2)out.push([wilds[0],wilds[1]]);
  const anyS2=norm.find(t=>t.size===2);
  if(wilds.length>=1&&anyS2)out.push([wilds[0],anyS2]);
  return out;
}

  const bw=board.offsetWidth*view.s,bh=board.offsetHeight*view.s;
  view.tx=bw<=sw?(sw-bw)/2:Math.min(0,Math.max(sw-bw,view.tx));
  view.ty=bh<=sh?(sh-bh)/2:Math.min(0,Math.max(sh-bh,view.ty));
}
function zoomTo(s,cx,cy){
  const r=stageEl.getBoundingClientRect();
  const px=(cx-r.left-view.tx)/view.s,py=(cy-r.top-view.ty)/view.s;
  view.s=Math.max(view.fit,Math.min(1.6,s));
  view.tx=cx-r.left-px*view.s;view.ty=cy-r.top-py*view.s;
  clampView();applyView();
}
addEventListener("resize",resize);
function pop(el,text,bad){
  const p=document.createElement("div");
  p.className="pop"+(bad?" bad":"");p.textContent=text;
  p.style.left=(parseFloat(el.style.left)+6)+"px";
  p.style.top=(parseFloat(el.style.top)-8)+"px";
  board.appendChild(p);setTimeout(()=>p.remove(),870);
}
function banner(text){
  const c=$("combo");c.textContent=text;
  c.classList.remove("show");void c.offsetWidth;c.classList.add("show");
}
function shake(el){el.classList.add("wrong");setTimeout(()=>el.classList.remove("wrong"),320);}

/* ================= view gestures ================= */
const ptrs=new Map();let pinch=null,pan=null,lastTap=0;
stageEl.addEventListener("pointerdown",e=>{
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){
    cancelDrag();
    const [a,b]=[...ptrs.values()];
    pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:view.s,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,tx:view.tx,ty:view.ty};
    return;
  }
  if(!e.target.closest(".tile"))pan={x:e.clientX,y:e.clientY,tx:view.tx,ty:view.ty,moved:false};
},true);
stageEl.addEventListener("pointermove",e=>{
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size>=2){
    const [a,b]=[...ptrs.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y),r=stageEl.getBoundingClientRect();
    const ns=Math.max(view.fit,Math.min(1.6,pinch.s*(d/pinch.d)));
    const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    const px=(pinch.mx-r.left-pinch.tx)/pinch.s,py=(pinch.my-r.top-pinch.ty)/pinch.s;
    view.s=ns;view.tx=mx-r.left-px*ns;view.ty=my-r.top-py*ns;
    clampView();applyView();return;
  }
  if(pan){
    const dx=e.clientX-pan.x,dy=e.clientY-pan.y;
    if(!pan.moved&&Math.hypot(dx,dy)<6)return;
    pan.moved=true;view.tx=pan.tx+dx;view.ty=pan.ty+dy;clampView();applyView();
  }
},true);
function endGesture(e){
  ptrs.delete(e.pointerId);
  if(ptrs.size<2)pinch=null;
  if(pan){
    if(!pan.moved&&!e.target.closest(".tile")){
      const now=Date.now();
      if(now-lastTap<320){zoomTo(view.s<=view.fit*1.05?view.fit*2.2:view.fit,e.clientX,e.clientY);lastTap=0;}
      else lastTap=now;
    }
    pan=null;
  }
}
stageEl.addEventListener("pointerup",endGesture,true);
stageEl.addEventListener("pointercancel",endGesture,true);

/* ================= tile input ================= */
let drag=null;
function cancelDrag(){
  if(!drag)return;
  drag.el.classList.remove("drag");drag.el.style.transform="";drag.el.style.pointerEvents="";
  drag=null;
}
board.addEventListener("pointerdown",e=>{
  const el=e.target.closest(".tile");if(!el||!G||!loop||ptrs.size>1)return;
  const t=G.tiles[+el.dataset.i];if(t.removed)return;
  drag={t,el,sx:e.clientX,sy:e.clientY,moved:false};
  try{board.setPointerCapture(e.pointerId);}catch(err){}
});
board.addEventListener("pointermove",e=>{
  if(!drag||pinch)return;
  const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
  if(!drag.moved&&Math.hypot(dx,dy)<7)return;
  if(!drag.moved){drag.moved=true;drag.el.classList.add("drag");drag.el.style.pointerEvents="none";}
  drag.el.style.transform=`translate(${dx/scale}px,${dy/scale}px) scale(1.06)`;
});
board.addEventListener("pointerup",e=>{
  if(!drag)return;
  const d=drag;drag=null;
  if(!d.moved){select(d.t,d.el);return;}
  d.el.style.pointerEvents="none";
  const under=document.elementFromPoint(e.clientX,e.clientY);
  const tgt=under&&under.closest(".tile");
  d.el.classList.remove("drag");d.el.style.transform="";d.el.style.pointerEvents="";
  const L=live();
  if(!tgt||tgt===d.el)return;                 // dropped on felt: that was a peek
  if(!isFree(d.t,L))return;                   // dragging a buried tile only peeks
  const t2=G.tiles[+tgt.dataset.i];
  if(!t2||t2.removed||!isFree(t2,L))return;
  if(!G.sel.includes(d.t))select(d.t,d.el);
  select(t2,t2.el);
});
board.addEventListener("pointercancel",cancelDrag);

function select(t,el){
  const L=live();
  document.querySelectorAll(".tile.hint").forEach(x=>x.classList.remove("hint"));
  if(!isFree(t,L)){shake(el);toast("That tile is still covered.");return;}
  if(G.sel.includes(t)){G.sel=G.sel.filter(x=>x!==t);paint();return;}
  if(G.sel.length&&!G.sel.every(s=>compat(s,t))){
    shake(el);missed();G.sel=[t];paint();return;
  }
  G.sel.push(t);SFX.pick();HAP.buzz(8);poke();
  const need=Math.max(...G.sel.map(x=>x.size));
  if(G.sel.length>=need){const g=G.sel.slice();G.sel=[];resolveSet(g);return;}
  paint();
}
function missed(){
  G.miss++;G.flow=0;G.flowSuit=null;
  SFX.wrong();HAP.buzz(35);shakeScreen(3);
  if(G.mode==="run"&&G.penalty>0){
    G.time=Math.max(0,G.time-G.penalty);
    if(G.sel[0]&&G.sel[0].el)pop(G.sel[0].el,"−"+G.penalty+"s",true);
    drawClock();
  }
}
function resolveSet(group){
  group.forEach(t=>t.removed=true);

  /* stranded tiles from a broken set turn wild — and a broken triple's leftovers
     become loose wilds, or they would still be demanding a third tile forever */
  const ripple=[];
  new Set(group.map(t=>t.set)).forEach(sid=>{
    G.tiles.forEach(t=>{
      if(t.set===sid&&!t.removed&&!t.open){
        ripple.push({t,open:t.open,size:t.size});
        t.open=true;t.size=2;
      }
    });
  });
  G.history.push({group:group.map(t=>({t,open:t.open,size:t.size})),ripple});

  /* flow */
  const solid=group.filter(t=>!isWild(t));
  const suit=solid.length?solid[0].suit:null;
  if(suit&&suit===G.flowSuit)G.flow=Math.min(9,G.flow+1);
  else if(suit){G.flow=1;G.flowSuit=suit;}
  if(G.flow>=5&&G.flow>G.bestFlow)banner(`Flow ×${G.flow}`);
  G.bestFlow=Math.max(G.bestFlow,G.flow);

  const base=group.length===3?250:100;
  const pts=Math.round(base*Math.min(6,Math.max(1,G.flow))*G.mult);
  G.score+=pts;
  if(G.mode==="run")G.time+=G.gain*(group.length===3?1.6:1);
  group.forEach(t=>burst(t.el));
  flyScore(group[group.length-1].el,pts);
  SFX.match(G.flow,group.length===3);
  HAP.buzz(group.length===3?[12,26,12]:16);
  if(G.flow>=5)shakeScreen(4);
  poke();
  if(ripple.length){
    SFX.strand();
    toast(ripple.length+" tile"+(ripple.length>1?"s":"")+" stranded — now wild");
  }

  group.forEach(t=>{const el=t.el;el.classList.add("gone");setTimeout(()=>el.remove(),200);});
  checkGoal();
  setTimeout(afterMove,70);
}
function afterMove(){
  paint();
  if(live().length===0){clearStage();return;}
  if(findSets().length===0)noMoves();
}
function noMoves(){
  stop();
  show(`<h2>No moves left</h2><p class="sub">Nothing on the table can be cleared. Reshuffle what's left, or start this board again.</p>
    <div class="stack">
      ${G.shuffles>0?'<button class="btn" data-act="shuffle-now">Shuffle · '+G.shuffles+' left</button>':''}
      <button class="btn ghost" data-act="restart">Restart board</button>
      <button class="btn ghost" data-act="menu">Quit to menu</button>
    </div>`);
}

/* ================= goals & stars ================= */
function makeGoal(){
  if(G.mode==="run")return null;
  const counts={};
  G.tiles.forEach(t=>{if(!isWildSuit(t.suit))counts[t.suit]=(counts[t.suit]||0)+1;});
  const suits=Object.keys(counts).filter(s=>counts[s]>=6&&counts[s]<=24);
  const opts=[];
  if(suits.length){
    const s=suits[Math.random()*suits.length|0];
    opts.push({type:"suit",suit:s,total:counts[s],
      label:`Clear all ${counts[s]} ${SUITNAME[s]} before the board is 40% gone`});
  }
  opts.push({type:"flow",need:4,label:"Reach a flow of ×4"});
  opts.push({type:"clean",label:"Clear the board without using a prop"});
  const g=opts[Math.random()*opts.length|0];
  g.done=false;g.failed=false;
  return g;
}
function checkGoal(){
  const g=G.goal;if(!g||g.done||g.failed)return;
  const L=live();
  if(g.type==="flow"){ if(G.flow>=g.need){g.done=true;banner("Goal met");} }
  if(g.type==="suit"){
    const left=L.filter(t=>t.suit===g.suit&&!t.open).length;
    const gonePct=1-L.length/G.total;
    if(left===0){g.done=true;banner("Goal met");}
    else if(gonePct>=0.6)g.failed=true;
  }
  if(g.type==="clean"&&G.propsUsed>0)g.failed=true;
}
function stars(){
  let n=1;
  if(G.goal&&G.goal.done)n++;
  if(G.miss<=2)n++;
  return n;
}
const starRow=n=>`<div class="stars" data-n="${n}"><span>☆</span><span>☆</span><span>☆</span></div>`;
function playStars(){
  const row=document.querySelector(".stars");if(!row)return;
  const n=+row.dataset.n,els=[...row.children];
  els.forEach((e,i)=>{ if(i>=n)return;
    setTimeout(()=>{e.textContent="★";e.className="on";SFX.star(i);HAP.buzz(18);},300*(i+1));
  });
}

/* ================= flow of play ================= */
function startCalm(level){
  G={mode:"calm",level,stageNo:level,stage:calmStage(level),score:0,tiles:null,sel:[],
     hints:3,shuffles:3,undos:3,history:[],flow:0,flowSuit:null,bestFlow:0,miss:0,propsUsed:0,
     mult:1,gain:0,penalty:0,boons:[],goal:null,total:0};
  $("timewrap").hidden=true;
  dealStage();
}
function startRun(){
  G={mode:"run",level:1,stageNo:0,stage:null,score:0,tiles:null,sel:[],
     hints:2,shuffles:2,undos:1,history:[],flow:0,flowSuit:null,bestFlow:0,miss:0,propsUsed:0,
     time:100,mult:1,gain:1.5,penalty:3,boons:[],goal:null,total:0};
  $("timewrap").hidden=false;
  nextRunStage();
}
function nextRunStage(){
  G.stageNo++;G.stage=runStage(G.stageNo);dealStage();
  if(G.stage.rush)toast("Rush — the clock drains faster.");
  else if(G.stage.fog)toast("Fog — buried tiles stay hidden.");
}
function dealStage(){
  const tiles=dealBoard(LAYOUTS[G.stage.l]());
  if(!tiles){toast("Could not build that board.");return;}
  G.tiles=tiles;G.total=tiles.length;G.sel=[];G.history=[];
  G.flow=0;G.flowSuit=null;G.bestFlow=0;G.miss=0;G.propsUsed=0;
  G.goal=makeGoal();G.stageStart=Date.now();
  render();start();
}
function start(){clearInterval(loop);loop=setInterval(tick,100);}
function stop(){clearInterval(loop);loop=null;}
function tick(){
  if(!G||G.mode!=="run")return;
  G.time-=.1*(G.stage.rush?1.4:1);
  if(G.time<=0){G.time=0;drawClock();gameOver("The clock ran out.");return;}
  drawClock();
}
function drawClock(){
  const t=Math.max(0,G.time),bar=$("bar");
  bar.querySelector("i").style.width=Math.min(100,(t/180)*100)+"%";
  bar.classList.toggle("low",t<20);
  $("timewrap").classList.toggle("low",t<20);
  $("clockText").textContent=Math.floor(t/60)+":"+String(Math.floor(t%60)).padStart(2,"0");
}
const fmt=s=>Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");

function clearStage(){
  stop();
  if(G.mode==="calm"){
    const secs=Math.round((Date.now()-G.stageStart)/1000);
    const n=stars();
    prog.level=Math.max(prog.level,G.level+1);
    prog.best=Math.max(prog.best,G.score);
    prog.stars[G.level]=Math.max(prog.stars[G.level]||0,n);
    save("prog",prog);
    SFX.win();HAP.buzz([14,40,14,40,30]);
    show(`<h2>Board cleared</h2>${starRow(n)}
      <div class="big">${G.score.toLocaleString()}</div>
      <p class="sub">${NAMES[G.stage.l]} · ${fmt(secs)} · best flow ×${G.bestFlow}</p>
      <div class="tally"><span>${G.goal?G.goal.label:"No goal"}</span><b>${G.goal&&G.goal.done?"met":"missed"}</b></div>
      <div class="tally"><span>Misplays</span><b>${G.miss}</b></div>
      <div class="stack">
        <button class="btn" data-act="next-level">Level ${G.level+1}</button>
        <button class="btn ghost" data-act="replay">Replay this level</button>
        <button class="btn ghost" data-act="menu">Menu</button>
      </div>`);
    playStars();
    return;
  }
  const spent=Math.round((Date.now()-G.stageStart)/1000);
  const bonus=500*G.stageNo+Math.max(0,90-spent)*5;
  G.score+=bonus;G.time+=25;
  show(`<h2>Stage ${G.stageNo} cleared</h2><p class="sub">Take one boon for the rest of the run.</p>
    <div class="tally"><span>Clear bonus</span><b>+${bonus.toLocaleString()}</b></div>
    <div class="tally"><span>Time returned</span><b>+25s</b></div>
    <div class="stack" id="boons"></div>`);
  offerBoons();
}

  if(act==="resume"){hide();start();}
  if(act==="restart"){hide();dealStage();}
  if(act==="shuffle-now"){hide();start();doShuffle();}
});

/* ================= props ================= */
/* stranded singles can't be cleared alone, so a shuffle re-forms them into playable sets */
function regroup(rest){
  const bySet=new Map();
  rest.forEach(t=>{(bySet.get(t.set)||bySet.set(t.set,[]).get(t.set)).push(t);});
  const singles=[],keep=[];
  [...bySet.values()].forEach(g=>g.length===1?singles.push(g[0]):keep.push(g));
  let nid=Math.max(0,...rest.map(t=>t.set))+1;
  for(let i=0;i+1<singles.length;i+=2){
    const g=[singles[i],singles[i+1]];
    g.forEach(t=>{t.set=nid;t.size=2;t.open=true;});
    keep.push(g);nid++;
  }
  if(singles.length%2){
    const lone=singles[singles.length-1];
    const host=keep.find(g=>g.length===2&&g.every(t=>!t.open));
    if(host){
      const g=[...host,lone];
      g.forEach(t=>{t.set=nid;t.size=3;});
      keep[keep.indexOf(host)]=g;nid++;
    } else keep.push([lone]);
  }
  return keep;
}
function reshuffle(){
  const rest=live();
  // shuffle the sets FIRST, then peel to those sizes, or slots and sets fall out of step
  const groups=shuffled(regroup(rest));
  const order=peel(rest.map(t=>({x:t.x,y:t.y,z:t.z})),groups.map(g=>g.length));
  if(!order)return false;
  const moved=[];
  order.forEach((posGroup,gi)=>{
    const src=groups[gi];
    posGroup.forEach((pos,k)=>{
      const t=src[k];
      moved.push({t,x:pos.x,y:pos.y,z:pos.z});
    });
  });
  moved.forEach(m=>{m.t.x=m.x;m.t.y=m.y;m.t.z=m.z;});
  return true;
}
function doShuffle(){
  if(!G||G.shuffles<=0)return;
  G.sel=[];
  if(reshuffle()){G.shuffles--;G.propsUsed++;G.history=[];checkGoal();render();toast("Reshuffled — a clean solution still exists.");}
  else toast("Shuffle failed. Board unchanged.");
}
$("p-shuf").onclick=doShuffle;
$("p-hint").onclick=()=>{
  if(!G||!loop||G.hints<=0)return;
  const m=findSets();
  if(!m.length){toast("Nothing matches — try a shuffle.");return;}
  G.hints--;G.propsUsed++;checkGoal();
  m[hintIdx++%m.length].forEach(t=>t.el.classList.add("hint"));
  paint();
};
$("p-undo").onclick=()=>{
  if(!G||!loop||G.undos<=0||!G.history.length)return;
  const last=G.history.pop();
  last.group.forEach(r=>{r.t.removed=false;r.t.open=r.open;r.t.size=r.size;});
  last.ripple.forEach(r=>{r.t.open=r.open;r.t.size=r.size;});
  G.undos--;G.propsUsed++;G.sel=[];G.flow=0;G.flowSuit=null;
  G.score=Math.max(0,G.score-100);
  checkGoal();render();
};
$("btn-back").onclick=()=>{
  if(!G){home();return;}
  stop();
  show(`<h2>Paused</h2><p class="sub">${G.mode==="run"?`Stage ${G.stageNo}`:`Level ${G.level} · ${NAMES[G.stage.l]}`}</p>
    <div class="big">${G.score.toLocaleString()}</div>
    <div class="stack"><button class="btn" data-act="resume">Resume</button>
    <button class="btn ghost" data-act="settings">Settings</button>
    <button class="btn ghost" data-act="restart">Restart board</button>
    <button class="btn ghost" data-act="menu">Quit to menu</button></div>`);
};

/* ================= boot ================= */
(async()=>{
  const p=await load("prog");if(p)prog=Object.assign(prog,p,{stars:p.stars||{}});
  const st=await load("settings");if(st)Object.assign(SET,st);
  applyMotion();home();
})();
window.__game={noMoves,findSets,live,isFree,keyOf,isWild,LAYOUTS,dealBoard,startCalm,home,zoomTo,stars,SET,SFX,HAP,settings,nudge,
  get G(){return G;},get view(){return view;}};
})();
